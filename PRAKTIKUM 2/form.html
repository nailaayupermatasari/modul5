<html>
<head>
    <title>Layout Tabel</title>
</head>

<body>

<table width="450px" height="300px" border="1" cellspacing="0">

    <tr height="50%">
        <!-- A -->
        <td width="33%" align="center">A</td>

        <!-- Tabel B, C, D, E -->
        <td colspan="2" width="67%" height="50%" style="padding: 0;">

            <table width="100%" height="100%" border="1" cellspacing="0">

                <tr height="50%">
                    <td width="50%" bgcolor="lightgray" align="center">B</td>
                    <td width="50%" align="center">C</td>
                </tr>

                <tr height="50%">
                    <td align="center">D</td>
                    <td bgcolor="lightgray" align="center">E</td>
                </tr>

            </table>

        </td>
    </tr>

    <tr height="50%">
        <!-- Kolom kosong -->
        <td width="33%"></td>

        <!-- F -->
        <td width="33%" align="center">F</td>

        <!-- G -->
        <td width="34%" align="center">G</td>
    </tr>

</table>

</body>
</html>
