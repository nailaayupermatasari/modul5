<!DOCTYPE html>
<html>
<head>
    <title>Tabel Berwarna</title>
</head>

<body>

<table width="380px" height="530px" border="1"
       bordercolor="white" cellspacing="0">

    <tr>
        <!-- Biru kiri -->
        <td rowspan="4" bgcolor="blue" width="20%"></td>

        <!-- Biru atas -->
        <td colspan="2" bgcolor="blue" width="60%"></td>
    </tr>

    <tr>
        <!-- Hijau -->
        <td bgcolor="lime" width="20%"></td>
        <td bgcolor="lime" width="40%"></td>

        <!-- Biru kanan -->
        <td bgcolor="blue" width="20%"></td>
    </tr>

    <tr>
        <!-- Biru kiri bawah -->
        <td bgcolor="blue"></td>

        <!-- Putih tengah -->
        <td></td>

        <!-- Biru -->
        <td bgcolor="blue"></td>
    </tr>

    <tr>
        <td colspan="3"></td>
    </tr>

</table>

</body>
</html>
